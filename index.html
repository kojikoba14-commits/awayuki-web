<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>淡雪 — 金継ぎの記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EFE7D6;
    --bg-deep: #E7DCC5;
    --card: #F7F1E1;
    --ink: #3A2E22;
    --ink-soft: #6E6050;
    --line: #C9BB9C;
    --gold: #B7912E;
    --gold-bright: #D2A93A;
    --botan: #B14A6E;
    --botan-deep: #7C2F4C;
    --leaf: #6E7F4E;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1E1912;
      --bg-deep: #171310;
      --card: #292219;
      --ink: #EDE3D0;
      --ink-soft: #B9AC93;
      --line: #4A3F2E;
      --gold: #D2A93A;
      --gold-bright: #E6C158;
      --botan: #D68CA6;
      --botan-deep: #9A4A6A;
      --leaf: #8FA06A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1E1912;
    --bg-deep: #171310;
    --card: #292219;
    --ink: #EDE3D0;
    --ink-soft: #B9AC93;
    --line: #4A3F2E;
    --gold: #D2A93A;
    --gold-bright: #E6C158;
    --botan: #D68CA6;
    --botan-deep: #9A4A6A;
    --leaf: #8FA06A;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  header.top {
    position: sticky;
    top: 0;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 20px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    z-index: 5;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  header.top .brand {
    font-family: "Shippori Mincho", serif;
    font-size: 17px;
    letter-spacing: 0.06em;
  }
  header.top .brand small {
    font-family: "Noto Sans JP", sans-serif;
    font-size: 11px;
    color: var(--ink-soft);
    margin-left: 6px;
  }
  main {
    flex: 1;
    padding: 20px 20px 100px;
  }
  .view { display: none; }
  .view.active { display: block; animation: fadeUp 0.4s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .view.active { animation: none; }
  }

  /* ---- home ---- */
  .stage-card {
    background: var(--card);
    border: 1px solid var(--ink);
    border-radius: 2px;
    padding: 28px 22px 22px;
    text-align: center;
  }
  .eyebrow {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
  }
  .stage-name {
    font-family: "Shippori Mincho", serif;
    font-size: 30px;
    margin: 8px 0 2px;
    line-height: 1.4;
  }
  .stage-roma { font-size:12px; color:var(--ink-soft); letter-spacing:0.12em; margin:-2px 0 4px; }
  .mroma { font-size:9px; color:var(--ink-soft); letter-spacing:0.04em; margin-top:1px; }
  .stage-kana {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
  }
  .stage-phrase {
    font-family: "Shippori Mincho", serif;
    font-size: 14px;
    color: var(--ink-soft);
    margin: 14px 0 20px;
  }
  .bowl-wrap {
    position: relative;
    width: 200px;
    margin: 0 auto 18px;
  }
  .bowl-wrap.pulse::after {
    content: "";
    position: absolute;
    inset: var(--glow-inset, -24px);
    background: radial-gradient(circle, rgba(210,169,58, var(--glow-opacity, 0.5)), transparent 65%);
    border-radius: 50%;
    pointer-events: none;
    animation: glowPulse var(--glow-dur, 3.2s) ease-in-out infinite;
  }
  .bowl-wrap.memorial::after {
    background: radial-gradient(circle, rgba(210,169,58, 0.75), transparent 65%);
  }
  .crack-node { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }
  .crack-spark {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at center, rgba(230,193,88,0.95), transparent 60%);
    animation: sparkFlash 0.6s ease-out forwards;
  }
  @keyframes sparkFlash {
    0% { opacity: 0; transform: scale(0.6); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.35); }
  }
  .petal-fall {
    position: fixed;
    width: 18px; height: 18px;
    background: var(--gold-bright);
    border-radius: 2px 2px 7px 7px;
    z-index: 30;
    pointer-events: none;
    transform-origin: top center;
    animation: petalFall 1.05s ease-in forwards;
  }
  @keyframes petalFall {
    0% { transform: rotateX(0deg) translateY(0); opacity: 1; }
    35% { transform: rotateX(110deg) translateY(4px); opacity: 1; }
    100% { transform: rotateX(180deg) translateY(230px) rotate(18deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .crack-spark, .petal-fall, .day-page { animation: none; display: none; }
  }
  .day-page {
    position: fixed;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--ink-soft);
    z-index: 30;
    pointer-events: none;
    transform-origin: top center;
    animation: dayPageFall 1.3s cubic-bezier(.4,.7,.6,1) forwards;
  }
  @keyframes dayPageFall {
    0% { transform: rotateX(0deg) translateY(0) rotate(0deg); opacity: 1; }
    40% { transform: rotateX(140deg) translateY(20px) rotate(0deg); opacity: 1; }
    100% { transform: rotateX(180deg) translateY(340px) rotate(24deg); opacity: 0.9; }
  }
  .calendar-floor {
    position: relative;
    height: 30px;
    margin-top: 6px;
    border-top: 1px dashed var(--line);
  }
  .floor-page {
    position: absolute;
    bottom: 3px;
    width: 19px; height: 19px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 2px;
    font-size: 9px;
    color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.10);
  }
  .streak-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 6px 0;
  }
  .streak-mark svg { display: block; }
  .streak-line {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 2px;
  }
  .dashed {
    border-top: 1px dashed var(--line);
    margin: 20px 0;
  }
  .flower-of-month .eyebrow { text-align: center; }
  .flower-of-month {
    text-align: center;
  }
  .flower-of-month .fname {
    font-family: "Shippori Mincho", serif;
    font-size: 20px;
    margin: 6px 0 2px;
  }
  .flower-of-month .fmean {
    font-size: 12px;
    color: var(--ink-soft);
  }

  .question-card {
    margin-top: 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 18px;
  }
  .question-card .eyebrow { margin-bottom: 8px; }
  .question-text {
    font-family: "Shippori Mincho", serif;
    font-size: 16px;
    line-height: 1.7;
    margin-bottom: 12px;
  }
  textarea {
    width: 100%;
    min-height: 84px;
    resize: vertical;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    border-radius: 2px;
    padding: 10px 12px;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .row-end { display: flex; justify-content: flex-end; margin-top: 10px; }
  button.primary {
    background: var(--ink);
    color: var(--card);
    border: none;
    padding: 9px 18px;
    font-size: 13px;
    letter-spacing: 0.04em;
    border-radius: 2px;
    cursor: pointer;
  }
  button.primary:disabled { opacity: 0.4; cursor: default; }
  button.ghost, .ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 8px 16px;
    font-size: 13px;
    border-radius: 2px;
    cursor: pointer;
    display: inline-block;
  }
  .answered-note {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 10px;
  }

  /* ---- calendar ---- */
  .calendar-card {
    margin-top: 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 18px;
  }
  .cal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-head .month-label {
    font-family: "Shippori Mincho", serif;
    font-size: 18px;
  }
  .cal-head button {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink);
    width: 30px;
    height: 30px;
    border-radius: 2px;
    cursor: pointer;
    font-size: 14px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    text-align: center;
  }
  .grid .dow {
    font-size: 11px;
    color: var(--ink-soft);
    padding-bottom: 4px;
  }
  .grid .day {
    position: relative;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    border: 1px solid transparent;
    border-radius: 2px;
    cursor: pointer;
    background: var(--card);
  }
  .grid .day.empty { background: transparent; cursor: default; }
  .grid .day.today { border-color: var(--gold); font-weight: 700; }
  .grid .day.past { color: var(--ink-soft); background: color-mix(in srgb, var(--card) 85%, var(--ink) 15%); }
  .grid .day .dot {
    position: absolute;
    bottom: 4px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold);
  }
  .grid .day .star {
    position: absolute;
    top: 2px;
    right: 2px;
    font-size: 8px;
    color: var(--gold);
  }

  /* ---- archive ---- */
  .archive-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .mini-stage {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 6px 4px 8px;
    text-align: center;
    cursor: pointer;
  }
  .mini-stage.locked { opacity: 0.35; }
  .mini-stage .num { font-size: 9px; color: var(--ink-soft); }
  .mini-stage svg { width: 100%; height: auto; }
  .mini-stage .mname { font-size: 9px; margin-top: 2px; line-height: 1.3; }

  .photo-section { margin-top: 24px; }
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .photo-thumb {
    aspect-ratio: 1;
    overflow: hidden;
    border-radius: 2px;
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-empty { font-size: 12px; color: var(--ink-soft); margin-top: 10px; }

  /* ---- modal ---- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20,16,10,0.55);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 20;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--bg);
    width: 100%;
    max-width: 480px;
    border-radius: 10px 10px 0 0;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    max-height: 85vh;
    overflow-y: auto;
    border-top: 1px solid var(--line);
  }
  .sheet-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .sheet-head .date-label {
    font-family: "Shippori Mincho", serif;
    font-size: 17px;
  }
  .sheet-head button {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
  }
  .sheet label.check {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 14px 0 6px;
  }
  .sheet-photo-wrap { margin: 4px 0 14px; }
  .sheet-photo-wrap img { width: 100%; border-radius: 4px; display: block; }
  .photo-actions { display: flex; gap: 8px; margin: 4px 0 14px; }
  .photo-actions input[type=file] { display: none; }

  nav.bottom {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: var(--bg-deep);
    border-top: 1px solid var(--line);
    display: flex;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    z-index: 10;
  }
  nav.bottom button {
    flex: 1;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 14px 0 10px;
    cursor: pointer;
    position: relative;
    font-family: "Noto Sans JP", sans-serif;
  }
  nav.bottom button.active { color: var(--ink); }
  nav.bottom button.active::after {
    content: "";
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 2px;
    background: var(--gold);
  }
  nav.bottom.kb-hide { display: none; }
  #debug-banner {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #B70F3E;
    color: #fff;
    font-size: 11px;
    padding: 8px 12px;
    z-index: 999;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">淡雪 <small>— 金継ぎの記録</small></div>
  </header>

  <main>
    <section id="view-home" class="view active"></section>
    <section id="view-archive" class="view"></section>
  </main>

  <nav class="bottom">
    <button data-tab="home" class="active">今日</button>
    <button data-tab="archive">蔵</button>
  </nav>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>
<div id="debug-banner"></div>

  var el = document.getElementById("debug-banner");
  if (el){ el.style.display = "block"; el.textContent = "エラー: " + e.message + " (" + e.filename + ":" + e.lineno + ")"; }
});

  /* ---------------- storage ---------------- */
  var LS_PREFIX = "awayuki:";
  var dbDoc = null;

  var lsStore = {
    get: function(k, fallback){
      try {
        var v = localStorage.getItem(LS_PREFIX+k);
        return v === null ? fallback : JSON.parse(v);
      } catch(e){ return fallback; }
    },
    set: function(k, v){
      try { localStorage.setItem(LS_PREFIX+k, JSON.stringify(v)); } catch(e){}
    }
  };

  function loadFromLocalStorage(){
    return {
      points: lsStore.get("points", 0),
      diary: lsStore.get("diary", {}),          // { "YYYY-MM-DD": {answer, qIndex} }
      memorial: lsStore.get("memorial", []),    // ["YYYY-MM-DD", ...]
      qOrder: lsStore.get("qOrder", null),
      lastAnswerDate: lsStore.get("lastAnswerDate", null),
      streak: lsStore.get("streak", 0),
      lastPts: lsStore.get("lastPts", null),
      lastSeenDate: lsStore.get("lastSeenDate", null),
      floorDays: lsStore.get("floorDays", []),
      broken: lsStore.get("broken", false),
      breakAtDay: lsStore.get("breakAtDay", null),
      breakBaseline: lsStore.get("breakBaseline", 0)
    };
  }

  function saveToLocalStorage(s){
    lsStore.set("points", s.points);
    lsStore.set("diary", s.diary);
    lsStore.set("memorial", s.memorial);
    lsStore.set("qOrder", s.qOrder);
    lsStore.set("lastAnswerDate", s.lastAnswerDate);
    lsStore.set("streak", s.streak);
    lsStore.set("lastPts", s.lastPts);
    lsStore.set("lastSeenDate", s.lastSeenDate);
    lsStore.set("floorDays", s.floorDays);
    lsStore.set("broken", s.broken);
    lsStore.set("breakAtDay", s.breakAtDay);
    lsStore.set("breakBaseline", s.breakBaseline);
  }

  var state = { points:0, diary:{}, memorial:[], qOrder:null, lastAnswerDate:null, streak:0, lastPts:null, lastSeenDate:null, floorDays:[], broken:false, breakAtDay:null, breakBaseline:0 };
  var pendingCrackSpark = false;
  var pendingPetalFall = false;
  var pendingDayFall = false;
  var dayFallNumber = null;
  var dayFallDate = null;

  var writeInFlight = null;
  var writePending = false;

  function runWrite(){
    if (!writePending){ writeInFlight = null; return; }
    writePending = false;
    var snapshot = {
      points: state.points,
      diary: state.diary,
      memorial: state.memorial,
      qOrder: state.qOrder,
      lastAnswerDate: state.lastAnswerDate,
      streak: state.streak,
      lastPts: state.lastPts,
      lastSeenDate: state.lastSeenDate,
      floorDays: state.floorDays,
      broken: state.broken,
      breakAtDay: state.breakAtDay,
      breakBaseline: state.breakBaseline
    };
    writeInFlight = dbDoc.set(snapshot).catch(function(){}).then(runWrite);
  }

  function persist(){
    saveToLocalStorage(state); // 端末内バックアップとして常に保存
    if (!dbDoc) return;
    writePending = true;
    if (!writeInFlight) runWrite();
  }

  function shuffledIndices(n){
    var arr = []; for (var i=0;i<n;i++) arr.push(i);
    for (var j=arr.length-1;j>0;j--){
      var k = Math.floor(Math.random()*(j+1));
      var t = arr[j]; arr[j]=arr[k]; arr[k]=t;
    }
    return arr;
  }

  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function dayOfYear(d){
    var start = new Date(d.getFullYear(),0,0);
    var diff = d - start;
    return Math.floor(diff / 86400000);
  }

  var today = new Date();
  var todayKey = dateKey(today);

  function applyDayChange(){
    var prevSeen = state.lastSeenDate;
    if (prevSeen && prevSeen !== todayKey){
      pendingDayFall = true;
      dayFallNumber = Number(prevSeen.split("-")[2]);
      dayFallDate = prevSeen;
      if (state.floorDays.indexOf(prevSeen) === -1){
        state.floorDays.push(prevSeen);
      }
    }
    state.lastSeenDate = todayKey;
    if (!state.breakAtDay){
      state.breakAtDay = 3 + Math.floor(Math.random()*8);
    }
  }

  // iOSのSafariはタブを裏に回してもJSを終了させず、日付をまたいでも
  // 「今日」が更新されないことがあるため、表示に戻った時と定期的に
  // 実際の日付を確認し、変わっていれば再計算する。
  function refreshTodayIfChanged(){
    var now = new Date();
    var key = dateKey(now);
    if (key === todayKey) return false;
    today = now;
    todayKey = key;
    applyDayChange();
    persist();
    return true;
  }

  function rerenderCurrentView(){
    renderHome();
    if (document.getElementById("view-archive").classList.contains("active")){
      renderArchive();
    }
  }

  function currentStage(){
    if (!state.broken) return STAGES[0];
    var effective = Math.max(0, state.points - (state.breakBaseline||0));
    var idx = Math.max(2, Math.min(30, Math.floor(effective/8) + 1));
    return STAGES[idx-1];
  }

  function questionForToday(){
    if (!state.qOrder || !state.qOrder.length){
      state.qOrder = shuffledIndices(QUESTIONS.length);
    }
    var pos = dayOfYear(today) % state.qOrder.length;
    return { index: state.qOrder[pos], text: QUESTIONS[state.qOrder[pos]] };
  }

  function flowerForDate(d){
    return DAY_FLOWERS[dayOfYear(d) % DAY_FLOWERS.length];
  }

  function crackCountForStage(s){
    return Math.max(1, Math.round(s.id/30*CRACKS.length));
  }

  function crackJunctions(list){
    var seen = {};
    list.forEach(function(d){
      var m = d.match(/M([\d.]+),([\d.]+)\s*L([\d.]+),([\d.]+)/);
      if (!m) return;
      var p1 = m[1]+","+m[2], p2 = m[3]+","+m[4];
      seen[p1] = (seen[p1]||0)+1;
      seen[p2] = (seen[p2]||0)+1;
    });
    var pts = [];
    Object.keys(seen).forEach(function(k){
      if (seen[k] >= 2){
        var xy = k.split(",");
        pts.push({x:parseFloat(xy[0]), y:parseFloat(xy[1])});
      }
    });
    return pts;
  }

  function playKin(){
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1300, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(2100, ctx.currentTime+0.9);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.9);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime+0.9);
    } catch(e){}
  }

  function playKinSoft(){
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      var base = 1600 + Math.random()*500;
      osc.frequency.setValueAtTime(base, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(base*1.4, ctx.currentTime+0.45);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime+0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.45);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime+0.45);
    } catch(e){}
  }

  function segIntersect(x1,y1,x2,y2,x3,y3,x4,y4){
    var denom = (x1-x2)*(y3-y4) - (y1-y2)*(x3-x4);
    if (Math.abs(denom) < 1e-9) return null;
    var t = ((x1-x3)*(y3-y4) - (y1-y3)*(x3-x4)) / denom;
    var u = ((x1-x3)*(y1-y2) - (y1-y3)*(x1-x2)) / denom;
    if (t<0||t>1||u<0||u>1) return null;
    return {x: x1 + t*(x2-x1), y: y1 + t*(y2-y1)};
  }

  function streakLineSegs(n){
    var cx=40, cy=40;
    var segs = [];
    for (var i=1;i<=n;i++){
      var ang = (i * 137.508) * Math.PI/180;
      var r0 = 3 + (i % 5)*1.6;
      var r1 = 18 + (i % 7)*1.1;
      segs.push({
        x1: cx + r0*Math.cos(ang), y1: cy + r0*Math.sin(ang),
        x2: cx + r1*Math.cos(ang), y2: cy + r1*Math.sin(ang)
      });
    }
    return segs;
  }

  function streakJunctions(n){
    var cx=40, cy=40;
    var segs = streakLineSegs(n);
    var seen = {}, pts = [];
    for (var a=0; a<segs.length; a++){
      for (var b=a+1; b<segs.length; b++){
        var p = segIntersect(segs[a].x1,segs[a].y1,segs[a].x2,segs[a].y2, segs[b].x1,segs[b].y1,segs[b].x2,segs[b].y2);
        if (!p) continue;
        var d = Math.hypot(p.x-cx, p.y-cy);
        if (d < 6 || d > 26) continue;
        var key = Math.round(p.x*1.2)+","+Math.round(p.y*1.2);
        if (seen[key]) continue;
        seen[key] = true;
        pts.push(p);
        if (pts.length >= 40) return pts;
      }
    }
    return pts;
  }

  function streakCircleSVG(streak, opts){
    opts = opts || {};
    var n = Math.max(0, Math.min(200, streak|0));
    var cx=40, cy=40, r=26;
    var lines = '';
    var segs = streakLineSegs(n);
    segs.forEach(function(s){
      lines += '<line x1="'+s.x1.toFixed(1)+'" y1="'+s.y1.toFixed(1)+'" x2="'+s.x2.toFixed(1)+'" y2="'+s.y2.toFixed(1)+'" stroke="var(--gold)" stroke-width="1.3" stroke-linecap="round"/>';
    });
    var nodes = '';
    if (opts.interactive){
      var junctions = streakJunctions(n);
      junctions.forEach(function(pt){
        nodes += '<g class="crack-node" pointer-events="all">'+
          '<circle cx="'+pt.x.toFixed(1)+'" cy="'+pt.y.toFixed(1)+'" r="8" fill="rgba(0,0,0,0.001)"/>'+
          '<circle class="node-flash" cx="'+pt.x.toFixed(1)+'" cy="'+pt.y.toFixed(1)+'" r="1.5" fill="var(--gold-bright)" opacity="0">'+
            '<animate attributeName="r" values="1.5;9;1.5" dur="0.6s" begin="indefinite" fill="freeze"/>'+
            '<animate attributeName="opacity" values="0;0.9;0" dur="0.6s" begin="indefinite" fill="freeze"/>'+
          '</circle>'+
        '</g>';
      });
    }
    return '<svg viewBox="0 0 80 80" width="60" height="60">'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="var(--card)" stroke="var(--line)" stroke-width="1.2"/>'+
      lines+nodes+
    '</svg>';
  }

  function recordAnswer(text, qIndex){
    var pts = 1;
    var lower = text;
    SHARP_WORDS.forEach(function(w){ if (lower.indexOf(w) !== -1) pts += 1; });
    if (text.length > 40) pts += 1;
    pts = Math.min(pts, 5);

    var prevCracks = state.broken ? crackCountForStage(currentStage()) : 0;

    state.diary[todayKey] = Object.assign({}, state.diary[todayKey], {answer:text, qIndex:qIndex});
    state.points += pts;
    state.lastPts = pts;

    if (state.lastAnswerDate){
      var prev = new Date(state.lastAnswerDate);
      var diffDays = Math.round((today - new Date(prev.getFullYear(),prev.getMonth(),prev.getDate())) / 86400000);
      state.streak = diffDays === 1 ? state.streak + 1 : (diffDays === 0 ? state.streak : 1);
    } else {
      state.streak = 1;
    }
    state.lastAnswerDate = todayKey;

    if (!state.broken && state.breakAtDay && Object.keys(state.diary).length >= state.breakAtDay){
      state.broken = true;
      state.breakBaseline = state.points;
      pendingCrackSpark = true;
    } else if (state.broken && crackCountForStage(currentStage()) > prevCracks){
      pendingCrackSpark = true;
    }
    pendingPetalFall = true;

    persist();
  }

  function readAndResizeImage(file, maxDim, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.round(w * scale), ch = Math.round(h * scale);
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
        cb(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function escapeHTML(s){
    return s.replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function renderCalendar(){
    var y = calCursor.getFullYear(), m = calCursor.getMonth();
    var first = new Date(y, m, 1);
    var startWeekday = first.getDay();
    var daysInMonth = new Date(y, m+1, 0).getDate();
    var dows = ["日","月","火","水","木","金","土"];

    var cells = "";
    for (var d=0; d<dows.length; d++) cells += '<div class="dow">'+dows[d]+'</div>';
    for (var e=0; e<startWeekday; e++) cells += '<div class="day empty"></div>';
    for (var day=1; day<=daysInMonth; day++){
      var dt = new Date(y, m, day);
      var key = dateKey(dt);
      var hasEntry = !!state.diary[key];
      var isMemorial = state.memorial.indexOf(key) !== -1;
      var isToday = key === todayKey;
      var isPast = key < todayKey;
      cells += '<div class="day'+(isToday?' today':'')+(isPast?' past':'')+'" data-date="'+key+'">'+
        day +
        (isMemorial ? '<span class="star">☆</span>' : '') +
        (hasEntry ? '<span class="dot"></span>' : '') +
      '</div>';
    }

    var monthPrefix = y+'-'+String(m+1).padStart(2,'0')+'-';
    var floorDaysThisMonth = state.floorDays.filter(function(fd){ return fd.indexOf(monthPrefix) === 0; }).sort();
    var floorHtml = '';
    if (floorDaysThisMonth.length){
      floorHtml = '<div class="calendar-floor">'+
        floorDaysThisMonth.map(function(fd, i){
          var dNum = Number(fd.split("-")[2]);
          var rot = ((dNum*37) % 20) - 10;
          var left = 4 + i*11;
          return '<div class="floor-page" style="left:'+left+'px;transform:rotate('+rot+'deg);">'+dNum+'</div>';
        }).join('')+
      '</div>';
    }

    var html = ''+
      '<div class="cal-head">'+
        '<button id="cal-prev">‹</button>'+
        '<div class="month-label">'+y+'年 '+(m+1)+'月</div>'+
        '<button id="cal-next">›</button>'+
      '</div>'+
      '<div class="grid">'+cells+'</div>'+

  /* ---------------- render: archive ---------------- */
  function renderArchive(){
    var stage = currentStage();
    var cells = STAGES.map(function(s){
      var locked = s.id > stage.id;
      return '<div class="mini-stage'+(locked?' locked':'')+'" data-id="'+s.id+'">'+
        '<div class="num">'+pad(s.id)+'</div>'+
        bowlSVG(locked ? STAGES[0] : s, {mini:true})+
        '<div class="mname">'+(locked ? '？？？' : s.name)+'</div>'+
        (locked ? '' : '<div class="mroma">'+s.roma+'</div>')+
      '</div>';
    }).join("");
    var photoEntries = Object.keys(state.diary)
      .filter(function(k){ return state.diary[k] && state.diary[k].photo; })
      .sort()
      .reverse();
    var photoHTML = photoEntries.length
      ? '<div class="photo-grid">'+photoEntries.map(function(k){
          return '<div class="photo-thumb" data-date="'+k+'"><img src="'+state.diary[k].photo+'" alt=""></div>';
        }).join("")+'</div>'
      : '<div class="photo-empty">まだ写真の記録がありません。</div>';

    document.getElementById("view-archive").innerHTML =
      '<div class="cal-head"><div class="month-label">茶碗の収蔵庫</div><button id="back-today" style="width:auto;padding:0 10px;">今日の号へ</button></div>'+
      '<div class="archive-grid">'+cells+'</div>'+
      '<div class="photo-section"><div class="eyebrow">写真の記録</div>'+photoHTML+'</div>';

    document.getElementById("back-today").addEventListener("click", function(){ switchTab("home"); });
    Array.prototype.forEach.call(document.querySelectorAll(".mini-stage:not(.locked)"), function(el){
      el.addEventListener("click", function(){
        var s = STAGES[Number(el.getAttribute("data-id"))-1];
        openArchiveSheet(s);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".photo-thumb"), function(el){
      el.addEventListener("click", function(){ openDaySheet(el.getAttribute("data-date")); });
    });
  }

  function openArchiveSheet(s){
    document.getElementById("sheet").innerHTML =
      '<div class="sheet-head"><div class="date-label">'+pad(s.id)+' ・ '+s.name+'（'+s.kana+'）'+' · '+s.roma+'</div><button id="sheet-close">×</button></div>'+
      '<div style="width:160px;margin:0 auto 14px;">'+bowlSVG(s, {interactive:true})+'</div>'+
      '<div class="stage-phrase" style="text-align:center;">'+s.phrase+'</div>';
    document.getElementById("overlay").classList.add("open");
    document.getElementById("sheet-close").addEventListener("click", closeSheet);
    bindCrackNodes(document.getElementById("sheet"));
  }

  /* ---------------- tabs ---------------- */
  function switchTab(name){
    Array.prototype.forEach.call(document.querySelectorAll(".view"), function(v){ v.classList.remove("active"); });
    document.getElementById("view-"+name).classList.add("active");
    Array.prototype.forEach.call(document.querySelectorAll("nav.bottom button"), function(b){
      b.classList.toggle("active", b.getAttribute("data-tab") === name);
    });
    if (name === "archive") renderArchive();
    if (name === "home") renderHome();
  }

  Array.prototype.forEach.call(document.querySelectorAll("nav.bottom button"), function(b){
    b.addEventListener("click", function(){ switchTab(b.getAttribute("data-tab")); });
  });

  async function init(){
    document.getElementById("view-home").innerHTML =
      '<div class="stage-card" style="padding:60px 0;"><div class="eyebrow">読み込み中…</div></div>';

    var local = loadFromLocalStorage();
    Object.assign(state, local);

    try {
      if (window.claude && typeof window.claude.use === "function"){
        var db = await window.claude.use("db");
        if (db){
          dbDoc = db.doc("state/main");
          var snap = await dbDoc.get();
          if (snap.exists){
            Object.assign(state, JSON.parse(JSON.stringify(snap.data())));
          } else {
            var hasLocalData = (local.streak > 0) || Object.keys(local.diary || {}).length > 0;
            if (hasLocalData){
              try { await dbDoc.set(state); } catch(e){}
            }
          }
        }
      }
    } catch(e){ dbDoc = null; }

    applyDayChange();
    persist();

    renderHome();

    document.addEventListener("visibilitychange", function(){
      if (document.visibilityState === "visible" && refreshTodayIfChanged()){
        rerenderCurrentView();
      }
    });
    window.addEventListener("pageshow", function(){
      if (refreshTodayIfChanged()) rerenderCurrentView();
    });
    setInterval(function(){
      if (refreshTodayIfChanged()) rerenderCurrentView();
    }, 60000);
  }

  init();
})();
</script>
</body>
</html>
